[project]
name = "aeo-simulator"
version = "0.1.0"
description = "Sandbox search and answer-engine simulator for citation likelihood."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "psycopg[binary]>=3.2",
  "lightgbm>=4.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# scikit-learn is imported by scripts/claude and by the tests that load them.
dev = ["pytest>=8.3", "pandas>=2.2", "scikit-learn>=1.4", "pyarrow>=15"]
# Round 3 semantic features (scripts/claude/r3_semantic.py). CPU only, no torch.
semantic = ["onnxruntime>=1.18", "tokenizers>=0.15", "huggingface_hub>=0.23"]

[project.scripts]
aeo-worker = "aeo.worker:main"
ranksim = "aeo.ranksim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeo"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
