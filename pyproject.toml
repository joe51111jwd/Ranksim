[project]
name = "aeo-simulator"
version = "0.1.0"
description = "Sandbox search and answer-engine simulator for citation likelihood."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx>=0.27,<0.29",  # aeo.crawl.guard hooks httpcore 1.x internals; re-test before raising
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "psycopg[binary]>=3.2",
  "lightgbm>=4.0",
  "vercel-blob>=0.6,<0.7",  # cloud.py and objects.py are tested against the 0.6 API
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
aeo-worker = "aeo.worker:main"
ranksim = "aeo.ranksim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeo"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
