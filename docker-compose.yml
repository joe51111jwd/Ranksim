services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: aeo
      POSTGRES_DB: aeo
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo -d aeo"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://aeo:aeo@db:5432/aeo
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-64}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      PROCESS_JOBS_INLINE: "false"
      CRAWL_DELAY_SECONDS: "0.25"
    ports:
      - "8741:8741"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "aeo.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://aeo:aeo@db:5432/aeo
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-64}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      CRAWL_DELAY_SECONDS: "0.25"
    depends_on:
      db:
        condition: service_healthy
